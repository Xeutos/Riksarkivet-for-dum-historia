services:
  mysql:
    image: mysql:8.4
    container_name: 'db_riksarkivet'
    environment:
      MYSQL_DATABASE: Riksarkivet
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: