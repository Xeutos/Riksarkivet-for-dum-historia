services:
  mysql:
    image: mysql:8.4
    container_name: 'db_riksarkivet'
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/config/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/config/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  mysql_data: